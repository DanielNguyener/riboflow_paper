do_fastqc: false
do_check_file_existence: false
do_rnaseq: true
clip_arguments: -u 1 --maximum-length=40 --minimum-length=15 --quality-cutoff=28 -a
  AGATCGGAAGAGCACACGTCTGAACTCCAGTCAC --overlap=4 --trimmed-only
alignment_arguments:
  filter: -L 15 --no-unal --norc
  transcriptome: -L 15 --no-unal --norc
  genome: --no-unal -k 1
ribo:
  ref_name: appris-v1
  metagene_radius: 50
  left_span: 35
  right_span: 10
  read_length:
    min: 25
    max: 29
  coverage: true
output:
  individual_lane_directory: individual
  merged_lane_directory: merged
  intermediates:
    base: intermediates/H1-hESC
    clip: clip
    log: log
    transcriptome_alignment: transcriptome_alignment
    filter: filter
    genome_alignment: genome_alignment
    bam_to_bed: bam_to_bed
    quality_filter: quality_filter
    alignment_ribo: alignment_ribo
  output:
    base: output/H1-hESC
    log: log
    fastqc: fastqc
    ribo: ribo
    stats: stats
    bigwigs: bigwigs
    alignments: alignments
input:
  reference:
    filter: ${REFERENCES_FOR_RIBOFLOW}/filter/human/v1/human_rtRNA*
    transcriptome: ${REFERENCES_FOR_RIBOFLOW}/transcriptome/human/v2/riboflow_annot_and_ref/appris_human_v2_selected*
    regions: ${REFERENCES_FOR_RIBOFLOW}/transcriptome/human/v2/riboflow_annot_and_ref/appris_human_v2_actual_regions.bed
    transcript_lengths: ${REFERENCES_FOR_RIBOFLOW}/transcriptome/human/v2/riboflow_annot_and_ref/appris_human_v2_transcript_lengths.tsv
    genome: ${STAR_INDEX_DIR}
  fastq_base: ''
  fastq:
    H1-hESC:
    - ${FASTQ_DIR}/ribo/GSM4293622/SRR11005890_1.fastq.gz
rnaseq:
  clip_arguments: -u 5 -l 40 --quality-cutoff=28 --minimum-length=20
  fastq_base: ''
  filter_arguments: -L 15 --no-unal
  fastq:
    H1-hESC:
    - ${FASTQ_DIR}/rna/GSM4293640/SRR11005908_1.fastq.gz
  dedup_method: position
  umi_tools_extract_arguments: ''
  genome:
    mapping_quality_cutoff: 0
    filter_flags: 2052
  transcriptome:
    mapping_quality_cutoff: 10
    alignment_arguments: -L 15 --no-unal
do_strand_split: false
do_bigwig: true
dedup_method: position
umi_tools_extract_arguments: ''
umicollapse_arguments: ''
star:
  output_transcriptome_bam: false
  ribo_arguments: --alignEndsType EndToEnd --seedSearchStartLmax 15 --outFilterType
    Normal --outFilterMultimapNmax 20 --alignSJDBoverhangMin 1 --outFilterMismatchNoverReadLmax
    0.04 --winAnchorMultimapNmax 150 --twopassMode Basic
  rnaseq_arguments: --outFilterType BySJout --outFilterMultimapNmax 20 --alignSJoverhangMin
    8 --alignSJDBoverhangMin 1 --outFilterMismatchNmax 999 --outFilterMismatchNoverReadLmax
    0.04 --alignIntronMin 20 --alignIntronMax 1000000 --alignMatesGapMax 1000000
  sjdb_overhang: 28
  index_dir: ${STAR_INDEX_DIR}/GRCh38
genome:
  run: true
  mapping_quality_cutoff: 0
  ribo_filter_flags: 2052
transcriptome:
  run: true
  mapping_quality_cutoff: 10
