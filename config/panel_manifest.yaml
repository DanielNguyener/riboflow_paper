
schema_version: riboflow_paper/panel-manifest/2

defaults:
  formats: [pdf]

figures:
  S1:
    composer: grid_pair           # two 24 x 9 grids side by side
    panels: [figS1A, figS1B]
    page_in: [7.5, 8.75]
    label_pt: 12
    raster: {kind: matplotlib_pdf, dpi: 300, border_pt: 2.0}
    output: figures/published/S1_Fig
  2:
    composer: fitted_rows             # A / B / C|D rows, each panel fitted to its slot
    panels: [fig02A, fig02B, fig02C, fig02D]
    page_in: [7.5, 8.75]
    label_pt: 12
    raster: {kind: matplotlib_pdf, dpi: 300, border_pt: 2.0}
    output: figures/published/Fig2
    annotations: docs/Fig2_panel_annotations.md
  3:
    composer: single_panel          # one generator page, already PLOS-sized
    panels: [fig03]
    raster: {kind: generator_tiff, dpi: 300, border_pt: 2.0, min_font_pt: 7.0}
    output: figures/published/Fig3
  4:
    composer: rows_1to1             # native size, letters above each row
    rows: [[fig04A_plos, fig04B_plos, fig04C_plos, fig04D_plos]]
    letters: ABCD
    page: {max_width_pt: 540.0, margin_pt: 4.0, gutter_pt: 6.0,
           row_gap_pt: 10.0, letter_pt: 10.0}
    raster: {kind: fitz, dpi: 600}
    output: figures/published/Fig4
  5:
    composer: rows_1to1
    rows: [[fig05A], [fig05B]]
    letters: AB
    page: {max_width_pt: 540.0, margin_pt: 4.0, gutter_pt: 6.0,
           row_gap_pt: 10.0, letter_pt: 10.0}
    raster: {kind: fitz, dpi: 600}
    output: figures/published/Fig5
  6:
    composer: rows_1to1             # one generator page; its seven letters are drawn by the generator
    rows: [[fig06]]
    letters: [""]
    page: {max_width_pt: 540.0, margin_pt: 4.0, gutter_pt: 6.0,
           row_gap_pt: 10.0, letter_pt: 10.0}
    raster: {kind: fitz, dpi: 600}
    output: figures/published/Fig6

panels:

  # ── Figure 1 ────────────────────────────────────────────────────────────────
  - id: fig01
    figure: 1
    panel: null
    generator: null
    note: Author-drawn schematic, not a pipeline output. No generator.

  # ── S1 Fig ────────────────────────────────────────────────────────────────
  - id: figS1A
    figure: S1
    panel: A
    title: Read-length selection and P-site offsets agree between routes
    generator: code/panels/plot_readlen_psite_selection.py
    inputs:
      qc_genome: data/ribo_seq_qc/genome/tables/readlen_window_qc.csv
      qc_txome:  data/ribo_seq_qc/transcriptome/tables/readlen_window_qc.csv
      samples_csv: supporting_information/S1_Table/samples.csv
    output: results/panels/figS1A_readlen_psite_selection

  - id: figS1B
    figure: S1
    panel: B
    title: Whole-CDS frame-0 periodicity difference, genome minus transcriptome
    generator: code/panels/plot_cds_periodicity_difference.py
    inputs:
      frame_genome: data/ribo_seq_qc/genome/tables/cds_psite_frame.csv
      frame_txome:  data/ribo_seq_qc/transcriptome/tables/cds_psite_frame.csv
      samples_csv:    supporting_information/S1_Table/samples.csv
    output: results/panels/figS1B_cds_periodicity_difference

  # ── Figure 2 ────────────────────────────────────────────────────────────────
  - id: fig02A
    figure: 2
    panel: A
    title: COMT per-base coverage, genome versus transcriptome
    generator: code/panels/plot_transcript_coverage.py
    args:
      gene_id: ENSG00000093010          # COMT; resolves to ENST00000361682.11
      region: cds                       # published framing; default view is whole-transcript
      annotate_correlation: true
      route_legend: true
    inputs:
      coverage_h5: results/coverage/HeLa.shared_coverage.h5
    output: results/panels/fig02A_HeLa_COMT_coverage

  - id: fig02B
    figure: 2
    panel: B
    title: GAPDH per-base coverage, genome versus transcriptome
    generator: code/panels/plot_transcript_coverage.py
    args:
      gene_id: ENSG00000111640          # GAPDH; resolves to ENST00000396861.5
      region: cds
      annotate_correlation: true
      route_legend: true
    inputs:
      coverage_h5: results/coverage/HeLa.shared_coverage.h5
    output: results/panels/fig02B_HeLa_GAPDH_coverage

  - id: fig02C
    figure: 2
    panel: C
    title: Per-transcript concordance distribution per cell line
    generator: code/panels/plot_per_transcript_concordance.py
    inputs:
      psite:      data/coverage/concordance/region_concordance_per_transcript.tsv.gz
      footprint:  data/coverage/concordance/region_coverage_per_transcript.tsv.gz
      samples_csv: supporting_information/S1_Table/samples.csv
    output: results/panels/fig02C_per_transcript_concordance

  - id: fig02D
    figure: 2
    panel: D
    title: Pooled per-cell-line concordance
    generator: code/panels/plot_pooled_concordance.py
    args:
      ylim: [0.0, 1.005]
    inputs:
      psite:     data/coverage/concordance/region_concordance_per_sample.tsv
      footprint: data/coverage/concordance/region_coverage_per_sample.tsv
    output: results/panels/fig02D_pooled_concordance

  # ── Figure 3 ────────────────────────────────────────────────────────────────
  # One generator draws the combined page and the single panels from the same geometry.
  # The combined page IS the published figure (assemble_figures pages it into
  # Fig3_plos.pdf / Fig3.tif, which the clean-copy test checks byte-for-byte), so it
  # keeps no separate reference PDF; the singles are the panel-level references.
  - id: fig03
    reference: false
    figure: 3
    panel: null
    title: Alignment route and translation efficiency, three panels
    generator: code/te_route/plot_te_route_panels.py
    args: {panel: combined}
    inputs:
      per_gene_delta:    data/te_route/tables/per_gene_delta.tsv
      route_correlation: data/te_route/tables/route_correlation.tsv
      housekeeping_genes:       data/te_route/housekeeping/Housekeeping_GenesHuman.csv
      housekeeping_transcripts: data/te_route/housekeeping/Housekeeping_TranscriptsHuman.csv
    output: results/panels/fig03_te_route_combined

  - id: fig03A
    figure: 3
    panel: A
    title: Route agreement on log2 TE per cell line
    generator: code/te_route/plot_te_route_panels.py
    args: {panel: A}
    inputs:
      per_gene_delta:    data/te_route/tables/per_gene_delta.tsv
      route_correlation: data/te_route/tables/route_correlation.tsv
    output: results/panels/fig03A_route_agreement

  - id: fig03B
    figure: 3
    panel: B
    title: Ranked per-transcript delta TE with 95% CI
    generator: code/te_route/plot_te_route_panels.py
    args: {panel: B}
    inputs:
      per_gene_delta:    data/te_route/tables/per_gene_delta.tsv
      route_correlation: data/te_route/tables/route_correlation.tsv
    output: results/panels/fig03B_ranked_delta_te

  - id: fig03C
    figure: 3
    panel: C
    title: Mean delta RNA against mean delta Ribo
    generator: code/te_route/plot_te_route_panels.py
    args: {panel: C}
    inputs:
      per_gene_delta:    data/te_route/tables/per_gene_delta.tsv
      route_correlation: data/te_route/tables/route_correlation.tsv
      housekeeping_genes:       data/te_route/housekeeping/Housekeeping_GenesHuman.csv
      housekeeping_transcripts: data/te_route/housekeeping/Housekeeping_TranscriptsHuman.csv
    output: results/panels/fig03C_assay_plane

  # ── Figure 4 ────────────────────────────────────────────────────────────────
  - id: fig04A_plos
    figure: 4
    panel: A
    title: Distinct mapped read IDs per route, page size
    generator: code/panels/plot_cohort_plos_panels.py
    args: {panel: A, width_pt: 140.0, height_in: 4.75, font_pt: 8.0}
    inputs:
      taxonomy:    data/read_taxonomy/taxonomy/taxonomy_all.tsv
      samples_csv: supporting_information/S1_Table/samples.csv
    output: results/panels/fig04A_plos_route_read_counts

  - id: fig04B_plos
    figure: 4
    panel: B
    title: Read-ID union composition, page size
    generator: code/panels/plot_cohort_plos_panels.py
    args: {panel: B, width_pt: 142.0, height_in: 5.20, font_pt: 8.0}   # taller: union key
    inputs:
      taxonomy:    data/read_taxonomy/taxonomy/taxonomy_all.tsv
      samples_csv: supporting_information/S1_Table/samples.csv
    output: results/panels/fig04B_plos_read_id_union

  - id: fig04C_plos
    figure: 4
    panel: C
    title: Protein-coding to pseudogene tie share, page size
    generator: code/panels/plot_cohort_plos_panels.py
    args: {panel: C, width_pt: 103.0, height_in: 4.75, font_pt: 8.0}
    inputs:
      tie_master: data/read_taxonomy/multimap_biotype/multimap_tie_biotype_all.tsv
      taxonomy:   data/read_taxonomy/taxonomy/taxonomy_all.tsv
    output: results/panels/fig04C_plos_multimap_tie_biotype

  - id: fig04D_plos
    figure: 4
    panel: D
    title: Omitted alternative-exon overlap, page size
    generator: code/panels/plot_cohort_plos_panels.py
    args: {panel: D, width_pt: 103.0, height_in: 4.75, font_pt: 8.0}
    inputs:
      reach_master: data/read_taxonomy/reach/genome_anchored_reach_all.tsv
      taxonomy:     data/read_taxonomy/taxonomy/taxonomy_all.tsv
    output: results/panels/fig04D_plos_nonselected_isoform_reach

  - id: fig05A
    figure: 5
    panel: A
    title: Route-explicit seven-segment read-ID partition at COMT, GAPDH and LRRFIP1
    generator: code/panels/plot_gene_partition.py
    args:
      genes: [COMT, GAPDH, LRRFIP1]
      title: GSM2100602
      title_size: 8.0
      font_size: 8.0
      bar_height: 0.86
      xlabel: "Gene-associated read-ID union (%)"
      compact: true
    fit: {width_pt: 532.0, height_in: 2.05}
    inputs:
      derived_table: data/alignment_fate/gene_partition_route7.tsv
      derived_meta:  data/alignment_fate/gene_partition_route7.json
    output: results/panels/fig05A_gene_read_partition

  - id: fig05B
    figure: 5
    panel: B
    title: LRRFIP1 locus, exon-compressed, mirrored P-site coverage stacked by the panel-A
      read populations (same key colours), and isoform models
    generator: code/panels/plot_locus_coverage.py
    args:
      title: "LRRFIP1 — GSM2100602"
      title_outside: true
      title_size: 8.0
      font_size: 8.0
      ylabel: "P-site count"
      xlabel: "LRRFIP1 transcript models (5′→3′; introns compressed)"
      model_names: "Selected reference,Alternative isoform"
      marks_at_axis: true
      no_xticks: true
      compact: true
    fit: {width_pt: 532.0, height_in: 2.05}
    inputs:
      derived_npz:  data/alignment_fate/locus_LRRFIP1.npz
      derived_meta: data/alignment_fate/locus_LRRFIP1.json
    output: results/panels/fig05B_LRRFIP1_locus_coverage

  # ── Figure 6 ────────────────────────────────────────────────────────────────
  - id: fig06
    figure: 6
    panel: null
    title: HeLa genes clustered by read-fate composition (Ward, k = 4), with the cluster
      validation row; panels A-G lettered by the generator
    generator: code/panels/plot_read_fate_clusters.py
    inputs:
      clusters:  data/clustering/HeLa.post_dedup.clusters_k4.tsv
      centroids: data/clustering/HeLa.post_dedup.cluster_centroids.tsv
      tree:      data/clustering/HeLa.post_dedup.tree_merge.tsv
      pseudogene_counts:     data/clustering/HeLa.post_dedup.pseudogene_counts_genes.tsv
      omitted_sequence:      data/clustering/HeLa.post_dedup.omitted_sequence_genes.tsv
      reference_duplication: data/clustering/HeLa.post_dedup.reference_duplication_entries.tsv
    output: results/panels/fig06_read_fate_clusters
