
schema_version: riboflow_paper/panel-manifest/2

defaults:
  formats: [pdf]
  overwrite: false           

figures:
  2:
    composer: fig02_stack           # two 24 x 9 grids side by side, re-rendered to size
    panels: [fig02A, fig02B]
    page_in: [7.5, 8.75]
    label_pt: 12
    raster: {kind: matplotlib_pdf, dpi: 300, border_pt: 2.0}
    output: figures/published/Fig2
  3:
    composer: fig03_fit             # A / B / C|D rows, each panel fitted to its slot
    panels: [fig03A, fig03B, fig03C, fig03D]
    page_in: [7.5, 8.75]
    label_pt: 12
    raster: {kind: matplotlib_pdf, dpi: 300, border_pt: 2.0}
    output: figures/published/Fig3
    annotations: docs/Fig3_panel_annotations.md   # the numbers panels A/B no longer print
  4:
    composer: single_panel          # one generator page, already PLOS-sized
    panels: [fig04]
    # min_font_pt: the only sub-8 pt glyphs are mathtext sub/superscripts (log2, p_adj)
    # set at 70 % of their 10 pt base; every label, tick and key string is 10-12 pt.
    raster: {kind: generator_tiff, dpi: 300, border_pt: 2.0, min_font_pt: 7.0}
    output: figures/published/Fig4
  5:
    composer: rows_1to1             # panels placed at native size, letters above each row
    rows: [[fig05A_plos, fig05B_plos, fig05C_plos, fig05D_plos]]
    letters: ABCD
    page: {max_width_pt: 540.0, max_height_pt: 630.0, margin_pt: 4.0, gutter_pt: 6.0,
           row_gap_pt: 10.0, letter_pt: 10.0}
    raster: {kind: fitz, dpi: 600, fallback_dpi: 300}
    output: figures/published/Fig5
  6:
    composer: rows_1to1
    rows: [[fig06A], [fig06B]]
    letters: AB
    page: {max_width_pt: 540.0, max_height_pt: 630.0, margin_pt: 4.0, gutter_pt: 6.0,
           row_gap_pt: 10.0, letter_pt: 10.0}
    raster: {kind: fitz, dpi: 600, fallback_dpi: 300}
    output: figures/published/Fig6

panels:

  # ── Figure 1 ────────────────────────────────────────────────────────────────
  - id: fig01
    figure: 1
    panel: null
    generator: null
    note: >
      Author-drawn schematic. No generator exists and none is claimed; it is not a
      pipeline output.

  # ── Figure 2 ────────────────────────────────────────────────────────────────
  - id: fig02A
    figure: 2
    panel: A
    title: Read-length selection and P-site offsets agree between routes
    generator: code/panels/plot_readlen_psite_selection.py
    inputs:
      qc_genome: data/ribo_seq_qc/genome/tables/readlen_window_qc.csv
      qc_txome:  data/ribo_seq_qc/transcriptome/tables/readlen_window_qc.csv
      samples_csv: supporting_information/S1_Table/samples.csv
    columns_used: [sample, read_length, in_phase1, psite_offset, cell_line, ribo_GSM]
    output: results/panels/fig02A_readlen_psite_selection

  - id: fig02B
    figure: 2
    panel: B
    title: Whole-CDS frame-0 periodicity difference, genome minus transcriptome
    generator: code/panels/plot_cds_periodicity_difference.py
    inputs:
      frame_genome: data/ribo_seq_qc/genome/tables/cds_psite_frame.csv
      frame_txome:  data/ribo_seq_qc/transcriptome/tables/cds_psite_frame.csv
      samples_csv:    supporting_information/S1_Table/samples.csv
    columns_used: [sample, read_length, in_phase1, pct_frame0, cell_line, ribo_GSM]
    output: results/panels/fig02B_cds_periodicity_difference

  # ── Figure 3 ────────────────────────────────────────────────────────────────
  - id: fig03A
    figure: 3
    panel: A
    title: COMT per-base coverage, genome versus transcriptome
    generator: code/panels/plot_transcript_coverage.py
    args:
      gene_id: ENSG00000093010          # COMT; resolves to ENST00000361682.11
      signal: both
      region: cds                       # the published framing; default view is whole-transcript
      annotate_correlation: true
    inputs:
      coverage_h5: results/coverage/HeLa.shared_coverage.h5
    output: results/panels/fig03A_HeLa_COMT_coverage

  - id: fig03B
    figure: 3
    panel: B
    title: GAPDH per-base coverage, genome versus transcriptome
    generator: code/panels/plot_transcript_coverage.py
    args:
      gene_id: ENSG00000111640          # GAPDH; resolves to ENST00000396861.5
      signal: both
      region: cds
      annotate_correlation: true
    inputs:
      coverage_h5: results/coverage/HeLa.shared_coverage.h5
    output: results/panels/fig03B_HeLa_GAPDH_coverage

  - id: fig03C
    figure: 3
    panel: C
    title: Per-transcript concordance distribution per cell line
    generator: code/panels/plot_per_transcript_concordance.py
    args:
      ylim: [0.0, 1.0]
      highlight_sample: HeLa
      highlight_gapdh: ENST00000396861.5
      highlight_comt: ENST00000361682.11
    inputs:
      psite:      data/coverage/concordance/region_concordance_per_transcript.tsv.gz
      footprint:  data/coverage/concordance/region_coverage_per_transcript.tsv.gz
      samples_csv: supporting_information/S1_Table/samples.csv
    columns_used: [sample, transcript_id, spearman, pearson]
    output: results/panels/fig03C_per_transcript_concordance

  - id: fig03D
    figure: 3
    panel: D
    title: Pooled per-cell-line concordance
    generator: code/panels/plot_pooled_concordance.py
    args:
      ylim: [0.0, 1.005]
    inputs:
      psite:     data/coverage/concordance/region_concordance_per_sample.tsv
      footprint: data/coverage/concordance/region_coverage_per_sample.tsv
    columns_used: [sample, spearman_all, pearson_all]
    output: results/panels/fig03D_pooled_concordance

  # ── Figure 4 ────────────────────────────────────────────────────────────────
  # One generator draws the combined page and each panel on its own page from the SAME
  # solved geometry (code/te_route/plot_te_route_panels.py). The combined page is the
  # published figure; the singles are references for the panel-level verify.
  - id: fig04
    figure: 4
    panel: null
    title: Alignment route and translation efficiency, three panels
    generator: code/te_route/plot_te_route_panels.py
    args: {panel: combined}
    inputs:
      per_gene_delta:    data/te_route/tables/per_gene_delta.tsv
      route_correlation: data/te_route/tables/route_correlation.tsv
      housekeeping_genes:       data/te_route/housekeeping/Housekeeping_GenesHuman.csv
      housekeeping_transcripts: data/te_route/housekeeping/Housekeeping_TranscriptsHuman.csv
    columns_used: [transcript_id, gene_name, drna_mean, dribo_mean, dte_mean, dte_ci_low,
                   dte_ci_high, dte_padj, sample, spearman_rho, pearson_r, Ensembl]
    output: results/panels/fig04_te_route_combined

  - id: fig04A
    figure: 4
    panel: A
    title: Route agreement on log2 TE per cell line
    generator: code/te_route/plot_te_route_panels.py
    args: {panel: A}
    inputs:
      per_gene_delta:    data/te_route/tables/per_gene_delta.tsv
      route_correlation: data/te_route/tables/route_correlation.tsv
    columns_used: [sample, spearman_rho, pearson_r]
    output: results/panels/fig04A_route_agreement

  - id: fig04B
    figure: 4
    panel: B
    title: Ranked per-transcript delta TE with 95% CI
    generator: code/te_route/plot_te_route_panels.py
    args: {panel: B}
    inputs:
      per_gene_delta:    data/te_route/tables/per_gene_delta.tsv
      route_correlation: data/te_route/tables/route_correlation.tsv
    columns_used: [dte_mean, dte_ci_low, dte_ci_high]
    output: results/panels/fig04B_ranked_delta_te

  - id: fig04C
    figure: 4
    panel: C
    title: Mean delta RNA against mean delta Ribo
    generator: code/te_route/plot_te_route_panels.py
    args: {panel: C}
    inputs:
      per_gene_delta:    data/te_route/tables/per_gene_delta.tsv
      route_correlation: data/te_route/tables/route_correlation.tsv
      housekeeping_genes:       data/te_route/housekeeping/Housekeeping_GenesHuman.csv
      housekeeping_transcripts: data/te_route/housekeeping/Housekeeping_TranscriptsHuman.csv
    columns_used: [transcript_id, gene_name, drna_mean, dribo_mean, dte_mean, dte_padj, Ensembl]
    output: results/panels/fig04C_assay_plane

  # ── Figure 5 ────────────────────────────────────────────────────────────────
  - id: fig05A
    figure: 5
    panel: A
    title: Distinct mapped read IDs per route
    generator: code/panels/plot_route_read_counts.py
    inputs:
      taxonomy:  data/read_taxonomy/taxonomy/taxonomy_all.tsv
      samples_csv: supporting_information/S1_Table/samples.csv
    columns_used: [sample, n_universe, n_genome_unique, n_genome_multi, n_genome_absent,
                   n_txome_unique, n_txome_multi, n_txome_absent]
    output: results/panels/fig05A_route_read_counts

  - id: fig05B
    figure: 5
    panel: B
    title: Read-ID union composition
    generator: code/panels/plot_read_id_union.py
    inputs:
      taxonomy:    data/read_taxonomy/taxonomy/taxonomy_all.tsv
      samples_csv: supporting_information/S1_Table/samples.csv
    args: {hide_labels: true}
    columns_used: [sample, n_universe, n_gU_tU, n_gU_tM, n_gM_tU, n_gM_tM,
                   n_gU_tA, n_gM_tA, n_gA_tU, n_gA_tM]
    output: results/panels/fig05B_read_id_union

  - id: fig05C
    figure: 5
    panel: C
    title: Protein-coding to pseudogene tie share of genome multimappers
    generator: code/panels/plot_multimap_biotype.py
    inputs:
      tie_master: data/read_taxonomy/multimap_biotype/multimap_tie_biotype_all.tsv
      taxonomy:   data/read_taxonomy/taxonomy/taxonomy_all.tsv
    columns_used: [sample, pct_cross_pp_pc, pct_cross_pc_pp]
    output: results/panels/fig05C_multimap_tie_biotype

  - id: fig05D
    figure: 5
    panel: D
    title: Alternative-isoform exon share of genome-only unique reads
    generator: code/panels/plot_nonselected_isoform_reach.py
    inputs:
      reach_master: data/read_taxonomy/reach/genome_anchored_reach_all.tsv
      taxonomy:     data/read_taxonomy/taxonomy/taxonomy_all.tsv
    columns_used: [sample, n_nonselected_isoform_exon, n_gUtA]
    output: results/panels/fig05D_nonselected_isoform_reach

  - id: fig05A_plos
    figure: 5
    panel: A
    title: Distinct mapped read IDs per route, page size
    generator: code/panels/plot_fig05_plos_panels.py
    args: {panel: A, width_pt: 140.0, height_in: 4.75, font_pt: 8.0}
    inputs:
      taxonomy:    data/read_taxonomy/taxonomy/taxonomy_all.tsv
      samples_csv: supporting_information/S1_Table/samples.csv
    output: results/panels/fig05A_plos_route_read_counts

  - id: fig05B_plos
    figure: 5
    panel: B
    title: Read-ID union composition, page size
    generator: code/panels/plot_fig05_plos_panels.py
    args: {panel: B, width_pt: 142.0, height_in: 5.20, font_pt: 8.0}   # + the union key
    inputs:
      taxonomy:    data/read_taxonomy/taxonomy/taxonomy_all.tsv
      samples_csv: supporting_information/S1_Table/samples.csv
    output: results/panels/fig05B_plos_read_id_union

  - id: fig05C_plos
    figure: 5
    panel: C
    title: Protein-coding to pseudogene tie share, page size
    generator: code/panels/plot_fig05_plos_panels.py
    args: {panel: C, width_pt: 103.0, height_in: 4.75, font_pt: 8.0}
    inputs:
      tie_master: data/read_taxonomy/multimap_biotype/multimap_tie_biotype_all.tsv
      taxonomy:   data/read_taxonomy/taxonomy/taxonomy_all.tsv
    output: results/panels/fig05C_plos_multimap_tie_biotype

  - id: fig05D_plos
    figure: 5
    panel: D
    title: Alternative-isoform exon share, page size
    generator: code/panels/plot_fig05_plos_panels.py
    args: {panel: D, width_pt: 103.0, height_in: 4.75, font_pt: 8.0}
    inputs:
      reach_master: data/read_taxonomy/reach/genome_anchored_reach_all.tsv
      taxonomy:     data/read_taxonomy/taxonomy/taxonomy_all.tsv
    output: results/panels/fig05D_plos_nonselected_isoform_reach

  - id: fig06A
    figure: 6
    panel: A
    title: Route-explicit seven-segment read-ID partition at COMT, GAPDH and LRRFIP1
    generator: code/panels/plot_gene_partition.py
    args:
      genes: [COMT, GAPDH, LRRFIP1]
      title: GSM2100602
      title_size: 8.0
      font_size: 8.0
      bar_height: 0.86
      xlabel: "Gene-associated read-ID union (%)"
      compact: true
    fit: {width_pt: 532.0, height_in: 2.05}
    inputs:
      derived_table: data/alignment_fate/gene_partition_route7.tsv
      derived_meta:  data/alignment_fate/gene_partition_route7.json
    columns_used: [gene_name, transcript_id, n_union, segment_key, n_reads, gene_order]
    output: results/panels/fig06A_gene_read_partition

  - id: fig06B
    figure: 6
    panel: B
    title: LRRFIP1 locus, exon-compressed, mirrored P-site coverage and isoform models
    generator: code/panels/plot_locus_coverage.py
    args:
      title: "LRRFIP1 — GSM2100602"
      title_outside: true
      title_size: 8.0
      font_size: 8.0
      ylabel: "P-site count"
      xlabel: "LRRFIP1 transcript models (5′→3′; introns compressed)"
      model_names: "Selected reference,Alternative isoform"
      marks_right: true
      no_xticks: true
      compact: true
    fit: {width_pt: 532.0, height_in: 2.05}
    inputs:
      derived_npz:  data/alignment_fate/locus_LRRFIP1.npz
      derived_meta: data/alignment_fate/locus_LRRFIP1.json
    output: results/panels/fig06B_LRRFIP1_locus_coverage

gates: [numerical, review, reference]
