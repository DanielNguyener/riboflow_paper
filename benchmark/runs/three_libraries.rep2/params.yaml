do_check_file_existence: true
do_fastqc: false
do_rnaseq: true
do_strand_split: false
do_bigwig: false
clip_arguments: -a AAAAAAAAAACAAAAAAAAAA --overlap=4 --trimmed-only --maximum-length=56
  --minimum-length=31 --quality-cutoff=28
dedup_method: umicollapse
umi_tools_extract_arguments: -p "^(?P<umi_1>.{12})(?P<discard_1>.{4}).+$" --extract-method=regex
umicollapse_arguments: ''
alignment_arguments:
  filter: -L 15 --no-unal --norc
  transcriptome: -L 15 --no-unal --norc
star:
  output_transcriptome_bam: false
  ribo_arguments: --alignEndsType EndToEnd --seedSearchStartLmax 15 --outFilterType
    Normal --outFilterMultimapNmax 20 --alignSJDBoverhangMin 1 --outFilterMismatchNoverReadLmax
    0.04 --winAnchorMultimapNmax 150
  rnaseq_arguments: --outFilterType BySJout --outFilterMultimapNmax 20 --alignSJoverhangMin
    8 --alignSJDBoverhangMin 1 --outFilterMismatchNmax 999 --outFilterMismatchNoverReadLmax
    0.04 --alignIntronMin 20 --alignIntronMax 1000000 --alignMatesGapMax 1000000
genome:
  run: true
  mapping_quality_cutoff: 255
  ribo_filter_flags: 2308
transcriptome:
  run: true
  mapping_quality_cutoff: 42
ribo:
  ref_name: appris_human_v2
  metagene_radius: 50
  left_span: 35
  right_span: 10
  read_length:
    min: 15
    max: 40
  coverage: true
rnaseq:
  fastq_base: ${FASTQ_DIR}/
  clip_arguments: -u 1 --quality-cutoff=28 --minimum-length=20
  filter_arguments: -L 15 --no-unal
  dedup_method: none
  umi_tools_extract_arguments: ''
  genome:
    mapping_quality_cutoff: 255
    filter_flags: 2308
  transcriptome:
    mapping_quality_cutoff: 42
    alignment_arguments: -L 15 --no-unal
  fastq:
    GSM8325903:
    - rnaseq/GSM8325891/SRR29385983.fastq.gz
    GSM8325907:
    - rnaseq/GSM8325895/SRR29385979.fastq.gz
    GSM8325911:
    - rnaseq/GSM8325899/SRR29385975.fastq.gz
input:
  fastq_base: ${FASTQ_DIR}/
  fastq:
    GSM8325903:
    - ribo/GSM8325903/SRR29385971.fastq.gz
    GSM8325907:
    - ribo/GSM8325907/SRR29385967.fastq.gz
    GSM8325911:
    - ribo/GSM8325911/SRR29385963.fastq.gz
  reference:
    genome: ${STAR_INDEX_DIR}
    filter: ${REFERENCES_DIR}/filter/human/v1/human_rtRNA*
    transcriptome: ${REFERENCES_DIR}/transcriptome/human/v2/riboflow_annot_and_ref/appris_human_v2_selected*
    regions: ${REFERENCES_DIR}/transcriptome/human/v2/riboflow_annot_and_ref/appris_human_v2_actual_regions.bed
    transcript_lengths: ${REFERENCES_DIR}/transcriptome/human/v2/riboflow_annot_and_ref/appris_human_v2_transcript_lengths.tsv
output:
  individual_lane_directory: individual
  merged_lane_directory: merged
  intermediates:
    base: ${RUN_DIR}/int
  output:
    base: ${RUN_DIR}/out
