
do_check_file_existence: true
do_fastqc:       false   # excluded by design: fixed cost, not under test
do_rnaseq:       true
do_strand_split: false
do_bigwig:       false   # excluded by design (deepTools bamCoverage)

clip_arguments: >-
  -a AAAAAAAAAACAAAAAAAAAA
  --overlap=4
  --trimmed-only
  --maximum-length=56
  --minimum-length=31
  --quality-cutoff=28

umi_tools_extract_arguments: >-
  -p "^(?P<umi_1>.{12})(?P<discard_1>.{4}).+$"
  --extract-method=regex
umicollapse_arguments: ""

alignment_arguments:
  filter:        '-L 15 --no-unal --norc'
  transcriptome: '-L 15 --no-unal --norc'

star:
  output_transcriptome_bam: false
  ribo_arguments: >-
    --alignEndsType EndToEnd
    --seedSearchStartLmax 15
    --outFilterType Normal
    --outFilterMultimapNmax 20
    --alignSJDBoverhangMin 1
    --outFilterMismatchNoverReadLmax 0.04
    --winAnchorMultimapNmax 150

  rnaseq_arguments: >-
    --outFilterType BySJout
    --outFilterMultimapNmax 20
    --alignSJoverhangMin 8
    --alignSJDBoverhangMin 1
    --outFilterMismatchNmax 999
    --outFilterMismatchNoverReadLmax 0.04
    --alignIntronMin 20
    --alignIntronMax 1000000
    --alignMatesGapMax 1000000

genome:
  run: true
  mapping_quality_cutoff: 255   # STAR MAPQ 255 == unique
  samtools_filter_arguments: "-F 2308"  # unmapped(4) + secondary(256) + supplementary(2048)

transcriptome:
  run: true
  mapping_quality_cutoff: 42

ribo:
  ref_name:        appris_human_v2   # must match references/human_server.yaml
  metagene_radius: 50
  left_span:       35
  right_span:      10
  read_length:
    min: 15                          # = 31 nt clip floor - 16 nt UMI+discard
    max: 40                          # = 56 nt clip ceiling - 16 nt UMI+discard
  coverage: true                     # production setting; dominates RIBOPY_CREATE

rnaseq:
  fastq_base:       ${FASTQ_DIR}/
  clip_arguments:   '-u 1 --quality-cutoff=28 --minimum-length=20'
  filter_arguments: '-L 15 --no-unal'   # no --norc: RNA-seq is not strand-selected
  dedup_method:     "none"
  umi_tools_extract_arguments: ""
  genome:
    mapping_quality_cutoff: 255
    samtools_filter_arguments: "-F 2308"
  transcriptome:
    mapping_quality_cutoff: 42
    alignment_arguments:   '-L 15 --no-unal'

input:
  fastq_base: ${FASTQ_DIR}/

output:
  individual_lane_directory: individual
  merged_lane_directory:     merged
  intermediates:
    base: ./results/_scratch/int
  output:
    base: ./results/_scratch/out
