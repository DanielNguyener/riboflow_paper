[pytest]
# Tests for the standalone pipeline code under code/. Run with Python 3.9, invoked as
# `python` (see requirements.txt), and install requirements-dev.txt first:
#
#     python -m pytest tests -q
#
# The real-BAM acceptance test is skipped unless a RiboFlow output tree is supplied:
#
#     RIBOFLOW_PAPER_BAMS=/path/to/riboflow/output python -m pytest tests -q
testpaths = tests
addopts = -ra
markers =
    bams: needs a real RiboFlow BAM tree (set RIBOFLOW_PAPER_BAMS)
filterwarnings =
    # matplotlib 3.9.4 calls pyparsing APIs that pyparsing 3 deprecates. Third-party,
    # unrelated to anything under test, and the matplotlib version is pinned by the
    # published artifacts, so it is silenced rather than
    # worked around.
    ignore:.*oneOf.*:Warning
    ignore:.*parseString.*:Warning
    ignore:.*resetCache.*:Warning
    ignore:.*enablePackrat.*:Warning
